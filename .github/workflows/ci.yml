name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # One `unittest discover` from evalkit/ runs the full suite (normalize +
      # rule + goal + efficiency + graph). The page-harness tests under
      # graph/tests/ are skipped automatically when `node` is not present.
      - name: evalkit — full test suite
        working-directory: evalkit
        run: python -m unittest discover -v

      - name: evalkit — sample rule smoke test
        working-directory: evalkit
        run: python -m rule.runner rules/example-minimal.checks.json examples/sample.normalized.json

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          shellcheck install.sh hooks/*.sh hooks/demos/*.sh bin/kiro-trace || true
          # Non-fatal for now; tighten in follow-up.
